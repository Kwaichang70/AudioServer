# Release gate (V01.1): every push and pull request is verified on a clean
# checkout, so a green result no longer depends on somebody's local
# node_modules. Node 22 is the production runtime (Dockerfile NODE_IMAGE);
# Node 24 is the current development runtime.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Server tests (includes startup/shutdown smoke test)
        run: npm test --workspace=server

      - name: Client tests
        run: npm test --workspace=client

      - name: Build
        run: npm run build

      - name: Production dependency audit (report only)
        # Findings are triaged in SECURITY_AUDIT.md; this step keeps the
        # current picture visible in every run without blocking merges on
        # advisories that have no fix yet.
        run: npm audit --omit=dev --audit-level=high || true

  docker:
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: audioserver:ci
          build-args: |
            VERSION=ci
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and wait for readiness
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/music" "$RUNNER_TEMP/data"
          docker run -d --name audioserver-ci \
            -p 3001:3001 \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e MUSIC_LIBRARY_PATHS=/music \
            -v "$RUNNER_TEMP/music:/music:ro" \
            -v "$RUNNER_TEMP/data:/data" \
            audioserver:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/api/health/ready >/dev/null 2>&1; then
              echo "ready after ${i}s"
              break
            fi
            if [ "$i" = 60 ]; then
              echo "container never became ready"; docker logs audioserver-ci; exit 1
            fi
            sleep 1
          done
          curl -fsS http://localhost:3001/api/health/live
          curl -fsS http://localhost:3001/api/health/ready
          # The SPA must be served from the image (client/dist copied in).
          curl -fsS -o /dev/null -w 'index: %{http_code}\n' http://localhost:3001/

      - name: Docker HEALTHCHECK reports healthy
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' audioserver-ci)
            [ "$status" = healthy ] && { echo "healthy after ${i}s"; exit 0; }
            sleep 1
          done
          echo "HEALTHCHECK never reported healthy (last: $status)"
          docker inspect --format '{{json .State.Health}}' audioserver-ci
          exit 1

      - name: Graceful shutdown
        run: |
          set -euo pipefail
          docker stop -t 15 audioserver-ci
          code=$(docker inspect --format '{{.State.ExitCode}}' audioserver-ci)
          docker logs audioserver-ci | tail -n 30
          [ "$code" = 0 ] || { echo "container exited with $code"; exit 1; }

      - name: Container logs on failure
        if: failure()
        run: docker logs audioserver-ci || true
