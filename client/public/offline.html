<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e94560" />
    <title>AudioServer is offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f0f23;
        color: #e5e7eb;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        max-width: 28rem;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        color: #e94560;
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        line-height: 1.5;
        color: #9ca3af;
        margin: 0.5rem 0;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.75rem 1.5rem;
        min-height: 44px;
        font-size: 1rem;
        border: 0;
        border-radius: 0.375rem;
        background: #e94560;
        color: #fff;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No connection to AudioServer</h1>
      <p>
        This page could not reach the server. Music that is playing on a speaker keeps playing on
        the NAS; this app does not store music for offline listening.
      </p>
      <p>Check the Wi-Fi or the server, then try again.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
